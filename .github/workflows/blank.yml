name: Build Nebula Android

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build everything
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --project-name nebula --org com.nebula .

      - name: Patch Android project
        run: python3 scripts/setup_android.py

      - name: Align Kotlin and Java JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle.kts")
          text = p.read_text()
          block = '''\n\n// Nebula CI: third-party Flutter plugins may still default Kotlin bytecode to JVM 1.8.\n// Flutter's generated Android project compiles Java for JVM 11, so align all Kotlin\n// compilation tasks to JVM 11 using the Kotlin 2.x compilerOptions DSL.\nsubprojects {\n    tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask<*>>().configureEach {\n        compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)\n    }\n}\n'''
          marker = 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask<*>>()'
          if marker not in text:
              p.write_text(text.rstrip() + block)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nebula-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/nebula-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/nebula-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/nebula-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/nebula.aab
          ls -lh dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-android
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Nebula build ${{ github.run_number }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: dist/*
          generate_release_notes: true
